name: Build Experimental Autobuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build experimental package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install --upgrade setuptools_scm
          python -m pip install --upgrade build

      - name: Install dependencies
        run: |
          python -m pip install "llsd>=1.2.4"
          python -m pip install pydot
          python -m pip install "pyzstd==0.18.0"

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Show build result
        run: |
          echo "=========================================="
          echo " Experimental Autobuild package"
          echo "=========================================="
          echo
          ls -lh dist/

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v6  # ✅ Aktualisiert von v4/v5 auf v6
        with:
          name: autobuild-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 7
